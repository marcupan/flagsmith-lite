name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Stage 1: Fast quality gate (~30s) ──────────────────────────────────
  quality:
    name: Quality (lint · types · docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Docs link check
        run: pnpm docs:check-links

  # ── Stage 2a: Unit tests (no services needed, parallel with 2b) ──────
  test-unit:
    name: Test (unit)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Shared unit tests
        run: pnpm --filter @project/shared test

      - name: SDK unit tests
        run: pnpm --filter @project/sdk test

      - name: API unit tests
        run: pnpm --filter @project/api test:unit

  # ── Stage 2b: Integration tests (Postgres required, parallel with 2a) ─
  test-integration:
    name: Test (integration)
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flagr
          POSTGRES_USER: flagr
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: pnpm --filter @project/api exec tsx migrate.ts
        env:
          DATABASE_URL: postgres://flagr:password@localhost:5432/flagr

      - name: API integration tests
        run: pnpm --filter @project/api test:integration
        env:
          DATABASE_URL: postgres://flagr:password@localhost:5432/flagr
          REDIS_URL: ""
          API_KEY: test-api-key

      - name: API e2e tests
        run: pnpm --filter @project/api test:e2e
        env:
          DATABASE_URL: postgres://flagr:password@localhost:5432/flagr
          REDIS_URL: ""
          API_KEY: test-api-key

  # ── Stage 3: Build + artifact upload ───────────────────────────────────
  build:
    name: Build (artifact)
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: |
            apps/api/dist/
            apps/web/dist/
            packages/shared/dist/
            packages/sdk/dist/
          retention-days: 7

  # ── Stage 4: Docker smoke test ─────────────────────────────────────────
  docker-smoke:
    name: Docker smoke test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t flagr-api:ci .

      - name: Start Postgres
        run: |
          docker network create smoke-net
          docker run -d \
            --name smoke-db \
            --network smoke-net \
            -e POSTGRES_DB=flagr \
            -e POSTGRES_USER=flagr \
            -e POSTGRES_PASSWORD=password \
            postgres:16-alpine

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 20); do
            docker exec smoke-db pg_isready -U flagr && break
            sleep 2
          done

      - name: Start API container
        run: |
          docker run -d \
            --name flagr-api-smoke \
            --network smoke-net \
            -e DATABASE_URL=postgres://flagr:password@smoke-db:5432/flagr \
            -e REDIS_URL= \
            -e API_KEY=smoke-test-key \
            -p 3000:3000 \
            flagr-api:ci

      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health && break
            sleep 2
          done

      - name: Smoke test — health endpoint
        run: node scripts/smoke-health.mjs http://localhost:3000/health

      - name: Smoke test — flag CRUD
        run: |
          # Create flag
          curl -sf -X POST http://localhost:3000/api/v1/flags \
            -H "Content-Type: application/json" \
            -H "X-Api-Key: smoke-test-key" \
            -d '{"key":"smoke-flag","name":"Smoke Flag","enabled":false}' | jq .

          # List flags
          curl -sf http://localhost:3000/api/v1/flags \
            -H "X-Api-Key: smoke-test-key" | jq .

          # Evaluate flag (public endpoint)
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            http://localhost:3000/api/v1/evaluate/smoke-flag)
          [ "$STATUS" = "200" ] || { echo "Evaluate returned $STATUS"; exit 1; }

      - name: Cleanup
        if: always()
        run: |
          docker rm -f flagr-api-smoke smoke-db 2>/dev/null || true
          docker network rm smoke-net 2>/dev/null || true
