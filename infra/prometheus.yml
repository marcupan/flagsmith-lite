global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # flagsmith-lite API — scrape /metrics every 15s
  - job_name: flagsmith-api
    static_configs:
      - targets: ["api:3000"]
    metrics_path: /metrics
